# Push тега vX.Y.Z: тесты → APK, подписанный release-ключом → релиз «GeelyNavbar X.Y.Z».
# Ручной запуск (Actions → Release → Run workflow) — то же без релиза: проверить сборку и секреты
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # нужна вся история и теги: versionCode — число коммитов, versionName и заметки — от тегов

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Версия
        id: version
        run: |
          name=$(git describe --tags --match 'v[0-9]*' --always)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а сборка получит версию $name"; exit 1
          fi
          echo "name=${name#v}" >> "$GITHUB_OUTPUT"

      - name: Тесты
        run: ./gradlew testDebugUnitTest

      - name: Сборка APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          test -n "$KEYSTORE_BASE64" -a -n "$RELEASE_KEYSTORE_PASSWORD" || { echo "::error::Нет секретов с release-ключом"; exit 1; }
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE_FILE"
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "GeelyNavbar-$VERSION.apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "GeelyNavbar-$VERSION.apk" | grep -E 'DN|SHA-256'

      - name: Релиз
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          {
            git log --pretty='- %s' ${prev:+$prev..}HEAD
            echo
            echo "SHA-256 \`GeelyNavbar-$VERSION.apk\`: \`$(sha256sum "GeelyNavbar-$VERSION.apk" | cut -d' ' -f1)\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "GeelyNavbar-$VERSION.apk" \
            --verify-tag --title "GeelyNavbar $VERSION" --notes-file notes.md
